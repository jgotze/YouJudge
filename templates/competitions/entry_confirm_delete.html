{% extends 'base.html' %}

{% block title %}Delete Entry - YouJudge{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row">
        <div class="col-lg-6 offset-lg-3">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4 text-center">
                    <i class="bi bi-trash text-danger" style="font-size: 3rem;"></i>
                    <h3 class="fw-bold mt-3">Delete Entry</h3>
                    <p class="text-muted">Are you sure you want to delete the entry <strong>{{ entry.title }}</strong>? This cannot be undone.</p>
                    <form method="post">
                        {% csrf_token %}
                        <div class="d-flex gap-3 justify-content-center mt-4">
                            <a href="{% url 'competitions:detail' entry.competition.pk %}" class="btn btn-outline-secondary">
                                <i class="bi bi-arrow-left"></i> Back
                            </a>
                            <button type="submit" class="btn btn-danger">Delete Entry</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
