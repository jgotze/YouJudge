{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Update Status - YouJudge{% endblock %}

{% block content %}
<div class="container py-5">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="{% url 'competitions:dashboard' %}">Dashboard</a></li>
            <li class="breadcrumb-item"><a href="{% url 'competitions:detail' competition.pk %}">{{ competition.title }}</a></li>
            <li class="breadcrumb-item active">Update Status</li>
        </ol>
    </nav>

    <div class="row">
        <div class="col-lg-6 offset-lg-3">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <h3 class="fw-bold mb-1"><i class="bi bi-toggle-on"></i> Update Competition Status</h3>
                    <p class="text-muted mb-4">{{ competition.title }}</p>
                    {% crispy form %}
                    <a href="{% url 'competitions:detail' competition.pk %}" class="btn btn-outline-secondary mt-2">
                        <i class="bi bi-arrow-left"></i> Back
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
