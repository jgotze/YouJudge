{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Sign Up - YouJudge{% endblock %}

{% block content %}
<div style="min-height: calc(100vh - 60px); display: flex; align-items: center; justify-content: center; background: #f4f6f9; padding: 2rem 1rem;">
    <div style="width: 100%; max-width: 480px;">
        <div class="card p-4">
            <div class="text-center mb-4">
                <div style="width:64px;height:64px;background:#084B83;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;margin-bottom:1rem;">
                    <i class="bi bi-person-plus-fill" style="color:#fff;font-size:1.6rem;"></i>
                </div>
                <h3 class="fw-bold mb-1">Create Account</h3>
                <p style="color:#838E83;">Join YouJudge today</p>
            </div>

            {% crispy form %}

            <hr style="border-color:#e5e7eb;">
            <p class="text-center mb-0" style="font-size:0.875rem;color:#838E83;">
                Already have an account?
                <a href="{% url 'accounts:login' %}" style="color:#084B83;font-weight:600;">Login</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
