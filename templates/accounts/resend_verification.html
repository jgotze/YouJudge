{% extends 'base.html' %}

{% block title %}Resend Verification - YouJudge{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row">
        <div class="col-lg-5 offset-lg-3">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <h3 class="fw-bold mb-2"><i class="bi bi-envelope"></i> Resend Verification Email</h3>
                    <p class="text-muted mb-4">Enter your email address and we'll send a new verification link.</p>
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="email" class="form-label">Email Address</label>
                            <input type="email" name="email" id="email" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Send Verification Email</button>
                    </form>
                    <div class="text-center mt-3">
                        <a href="{% url 'accounts:login' %}" class="text-muted small">Back to Login</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
