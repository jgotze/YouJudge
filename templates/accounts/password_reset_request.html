{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Reset Password - YouJudge{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row">
        <div class="col-lg-5 offset-lg-3">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <h3 class="fw-bold mb-2"><i class="bi bi-key"></i> Reset Password</h3>
                    <p class="text-muted mb-4">Enter your email and we'll send a reset link.</p>
                    {% crispy form %}
                    <div class="text-center mt-3">
                        <a href="{% url 'accounts:login' %}" class="text-muted small">Back to Login</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
